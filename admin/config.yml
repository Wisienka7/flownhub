backend:
  name: github
  repo: Wisienka7/flownhub
  branch: main

media_folder: "."
public_folder: "/"

collections:
  - name: "strony"
    label: "Zarządzanie Treścią"
    files:
      - label: "Strona Główna - Kreator"
        name: "home"
        file: "content.json"
        fields:
          # --- SEKCJA HERO (Zawsze na górze) ---
          - {label: "Główne Hasło (Zamiast Sky is the limit)", name: "hero_title", widget: "string"}
          - {label: "Opis pod hasłem", name: "hero_desc", widget: "text"}
          - {label: "Tekst na przycisku głównym", name: "hero_btn_text", widget: "string"}
          
          # --- KREATOR BLOKÓW STRONY ---
          - label: "Sekcje na stronie (Dodawaj i przesuwaj bloki)"
            name: "sekcje"
            widget: "list"
            types:
              
             # BLOK 1: KAFELKI (np. "Brzmi znajomo?")
              - label: "Blok z kafelkami"
                name: "blok_kafelki"
                widget: "object"
                fields:
                  - {label: "Tytuł głównej sekcji", name: "tytul", widget: "string"}
                  - {label: "Opis sekcji (opcjonalny)", name: "opis", widget: "text", required: false}
                  - {label: "Styl wizualny kafelków", name: "styl", widget: "select", options: ["Niebieski (Rozwiązania)", "Czerwony (Problemy)"]}
                  - label: "Lista Kafelków"
                    name: "kafelki"
                    widget: "list"
                    fields:
                      - {label: "Tytuł kafelka", name: "tytul_kafelek", widget: "string"}
                      - {label: "Wybierz Ikonę", name: "ikona", widget: "select", options: ["Zegar", "Dokumenty", "Trybik", "Kopiuj", "Żarówka", "Ostrzeżenie", "Wykres"]}
                      - {label: "Tekst w kafelku", name: "tekst_kafelek", widget: "text"}
                      - {label: "Tekst na przycisku (opcjonalny)", name: "btn_text", widget: "string", required: false}
                      - {label: "Link do przycisku (opcjonalny)", name: "btn_link", widget: "string", required: false}

              # BLOK 2: TEKST + GRAFIKA
              - label: "Tekst i Grafika obok siebie"
                name: "blok_tekst_grafika"
                widget: "object"
                fields:
                  - {label: "Tytuł", name: "tytul", widget: "string"}
                  - {label: "Treść", name: "tresc", widget: "markdown"}
                  - {label: "Grafika/Zdjęcie", name: "zdjecie", widget: "image"}
                  - {label: "Układ", name: "uklad", widget: "select", options: ["Grafika po prawej", "Grafika po lewej"]}
                  - {label: "Tekst przycisku (opcjonalny)", name: "btn_text", widget: "string", required: false}
                  - {label: "Link przycisku (opcjonalny)", name: "btn_link", widget: "string", required: false}

              # BLOK 3: TYLKO TYTUŁ I TEKST
              - label: "Tylko Tytuł i Tekst"
                name: "blok_tytul_tekst"
                widget: "object"
                fields:
                  - {label: "Tytuł", name: "tytul", widget: "string"}
                  - {label: "Treść (możesz pogrubiać, robić akapity)", name: "tresc", widget: "markdown"}
                  - {label: "Tekst przycisku (opcjonalny)", name: "btn_text", widget: "string", required: false}
                  - {label: "Link przycisku (opcjonalny)", name: "btn_link", widget: "string", required: false}

              # BLOK 4: WŁASNY KOD HTML
              - label: "Zaawansowane: Własny Kod HTML"
                name: "blok_html"
                widget: "object"
                fields:
                  - {label: "Nazwa robocza bloku (tylko dla Ciebie, żebyś wiedziała co to)", name: "nazwa_robocza", widget: "string"}
                  - {label: "Wklej kod HTML", name: "kod", widget: "code"}

                  # BLOK 5: TYLKO TEKST (BEZ TYTUŁU)
              - label: "Sam tekst (bez tytułu)"
                name: "blok_sam_tekst"
                widget: "object"
                fields:
                  - {label: "Treść (możesz pogrubiać, robić akapity, linki)", name: "tresc", widget: "markdown"}

                  # BLOK 6: BANER CTA (Wezwanie do działania)
              - label: "Baner CTA (Wezwanie do działania)"
                name: "blok_cta"
                widget: "object"
                fields:
                  - {label: "Tytuł (zwykły tekst)", name: "tytul", widget: "string"}
                  - {label: "Tytuł wyróżniony (kolor cyjanowy - pojawi się na końcu)", name: "tytul_wyrozniony", widget: "string", required: false}
                  - {label: "Krótki opis (pod tytułem)", name: "opis", widget: "text"}
                  - {label: "Tekst na przycisku", name: "btn_text", widget: "string"}
                  - {label: "Link w przycisku (np. mailto:kontakt@flownhub.pl)", name: "btn_link", widget: "string"}
       # --- NOWA PODSTRONA: POLITYKA PRYWATNOŚCI ---
      - label: "Polityka Prywatności"
        name: "polityka"
        file: "polityka.json"
        fields:
          - {label: "Tytuł strony", name: "tytul", widget: "string", default: "Polityka Prywatności"}
          - {label: "Treść polityki", name: "tresc", widget: "markdown"}
          # --- PODSTRONA: AUTOMATYZACJE PROCESÓW ---
      - label: "Automatyzacje Procesów"
        name: "automatyzacje_procesow"
        file: "automatyzacje-procesow.json"
        fields:
          - {label: "Tytuł Hero (Sekcja Główna)", name: "hero_title", widget: "string", default: "Automatyzacje Procesów"}
          - {label: "Opis Hero", name: "hero_desc", widget: "text", required: false}
          - {label: "Tekst Przycisku Hero", name: "hero_btn_text", widget: "string", required: false}
          - label: "Sekcje"
            name: "sekcje"
            widget: "list"
            types:
              - label: "Blok: Kafelki"
                name: "blok_kafelki"
                widget: "object"
                fields:
                  - {label: "Tytuł Sekcji", name: "tytul", widget: "string"}
                  - {label: "Opis pod tytułem", name: "opis", widget: "text", required: false}
                  - {label: "Styl wizualny", name: "styl", widget: "select", options: ["Niebieski (Standard)", "Czerwony (Problemy)"], default: "Niebieski (Standard)"}
                  - label: "Kafelki"
                    name: "kafelki"
                    widget: "list"
                    fields:
                      - {label: "Ikona", name: "ikona", widget: "select", options: ["Zegar", "Dokumenty", "Trybik", "Żarówka", "Ostrzeżenie", "Wykres", "Kopiuj"]}
                      - {label: "Tytuł Kafelka", name: "tytul_kafelek", widget: "string"}
                      - {label: "Tekst", name: "tekst_kafelek", widget: "text"}
                      - {label: "Tekst Przycisku", name: "btn_text", widget: "string", required: false}
                      - {label: "Link Przycisku", name: "btn_link", widget: "string", required: false}
              - label: "Blok: Tekst + Grafika"
                name: "blok_tekst_grafika"
                widget: "object"
                fields:
                  - {label: "Tytuł", name: "tytul", widget: "string"}
                  - {label: "Treść", name: "tresc", widget: "markdown"}
                  - {label: "Zdjęcie (Link/Wybierz)", name: "zdjecie", widget: "image"}
                  - {label: "Układ", name: "uklad", widget: "select", options: ["Grafika po prawej", "Grafika po lewej"]}
                  - {label: "Tekst Przycisku", name: "btn_text", widget: "string", required: false}
                  - {label: "Link Przycisku", name: "btn_link", widget: "string", required: false}
              - label: "Blok: Tytuł + Tekst na środku"
                name: "blok_tytul_tekst"
                widget: "object"
                fields:
                  - {label: "Tytuł", name: "tytul", widget: "string"}
                  - {label: "Treść", name: "tresc", widget: "markdown"}
                  - {label: "Tekst Przycisku", name: "btn_text", widget: "string", required: false}
                  - {label: "Link Przycisku", name: "btn_link", widget: "string", required: false}
              - label: "Blok: Sam tekst (bez tytułu)"
                name: "blok_sam_tekst"
                widget: "object"
                fields:
                  - {label: "Treść (wyróżniona)", name: "tresc", widget: "markdown"}
              - label: "Blok: Baner CTA"
                name: "blok_cta"
                widget: "object"
                fields:
                  - {label: "Tytuł (Biały)", name: "tytul", widget: "string"}
                  - {label: "Tytuł (Kolorowy)", name: "tytul_wyrozniony", widget: "string", required: false}
                  - {label: "Opis", name: "opis", widget: "text"}
                  - {label: "Tekst Przycisku", name: "btn_text", widget: "string"}
                  - {label: "Link Przycisku", name: "btn_link", widget: "string"}

      # --- PODSTRONA: NARZĘDZIA UŁATWIAJĄCE PRACĘ ---
