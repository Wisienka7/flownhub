                      - {label: "Tytuł Kafelka", name: "tytul_kafelek", widget: "string"}
                      - {label: "Tekst", name: "tekst_kafelek", widget: "text"}
                      - {label: "Tekst Przycisku", name: "btn_text", widget: "string", required: false}
                      - {label: "Link Przycisku", name: "btn_link", widget: "string", required: false}
              - label: "Blok: Tekst + Grafika"
