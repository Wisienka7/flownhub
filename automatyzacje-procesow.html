<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatyzacje Procesów | Flow N Hub</title>

    <meta name="description" content="Poznaj nasze usługi automatyzacji procesów. Eliminujemy ręczną pracę i pomagamy skupić się na tym, co naprawdę ważne w biznesie.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { colors: { 'ngen-cyan': '#00f3ff', 'ngen-blue': '#231b4b', 'ngen-dark': '#05050a', 'ngen-red': '#ff3366' }, fontFamily: { 'orbitron': ['Orbitron', 'sans-serif'], 'space': ['Space Grotesk', 'sans-serif'] }, backgroundImage: { 'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))' } } } }
    </script>

    <link rel="stylesheet" href="main.css">
</head>
<body class="antialiased">
    <!-- Kosmiczne tło (zostaje!) -->
    <canvas id="webgl"></canvas>
    <div id="cursor-glow"></div>
    <div id="scroll-bar"></div>

    <!-- Puste kontenery, w które skrypt zaleje to samo Mega Menu i stopkę co na głównej -->
    <div id="navbar-container"></div>
    
    <!-- Tu zostaną wyrenderowane dynamiczne bloczki -->
    <main id="app-content"></main>
    
    <div id="footer-container"></div>

    <div id="cookie-banner" class="cookie-overlay" role="dialog" aria-modal="true" aria-labelledby="cookie-title" aria-hidden="true">
        <div class="cookie-card glass-panel rounded-2xl p-6 sm:p-8 text-center">
            <h2 id="cookie-title" class="font-orbitron text-lg font-bold text-white mb-3">Pliki cookies</h2>
            <p class="text-gray-300 text-sm leading-relaxed mb-6">Ta strona korzysta z ciasteczek... <a href="/polityka-prywatnosci.html" class="text-ngen-cyan hover:underline font-bold">Polityka Prywatności</a>.</p>
            <div class="flex flex-col-reverse sm:flex-row gap-3 sm:justify-center">
                <button id="decline-cookies" class="px-5 py-3 rounded-full border border-gray-600 text-gray-400 hover:bg-gray-800 transition-colors text-sm font-bold uppercase tracking-wider">Odrzuć</button>
                <button id="accept-cookies" class="px-5 py-3 rounded-full neon-border text-ngen-cyan hover:bg-ngen-cyan hover:text-black transition-all text-sm font-bold uppercase tracking-wider">Akceptuję</button>
            </div>
        </div>
    </div>

    <!-- GŁÓWNY SILNIK (Z Menu, Stopką i tłem) -->
    <script src="space-engine.js"></script>

    <!-- SKRYPT GENERUJĄCY DANE (z dostosowanym wyśrodkowanym Hero i ładowaniem automatyzacje-procesow.json) -->
    <script>
        const icons = {
            "Zegar": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            "Dokumenty": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`,
            "Trybik": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`,
            "Żarówka": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>`,
            "Ostrzeżenie": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`,
            "Wykres": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>`,
            "Kopiuj": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>`
        };

        const renderBtn = (text, link, isRed = false) => {
            if (!text) return '';
            const borderClass = isRed ? 'neon-border-red hover:shadow-[0_0_30px_#ff3366]' : 'neon-border hover:shadow-[0_0_30px_#00f3ff] hover:bg-ngen-cyan hover:text-black';
            const textClass = isRed ? 'text-ngen-red' : 'text-ngen-cyan';
            return `<a href="${link || '#'}" class="magnetic mt-6 inline-block px-6 py-2 text-sm font-bold uppercase tracking-wider rounded-full ${borderClass} ${textClass}">${text}</a>`;
        };

        // UWAGA: Tuta ładujemy dedykowany JSON dla tej podstrony!
        fetch('automatyzacje-procesow.json')
            .then(response => response.json())
            .then(data => {
                let html = '';

                // HERO - SPECJALNIE WYŚRODKOWANE I BEZ 3D LOGO DLA PODSTRON
                if (data.hero_title) {
                    html += `
                    <header class="relative pt-32 pb-16 lg:pt-48 lg:pb-24 overflow-hidden flex items-center justify-center min-h-[50vh] text-center">
                        <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full reveal">
                            <h2 class="text-ngen-cyan font-bold tracking-widest uppercase text-sm mb-4">Usługi Flow N Hub</h2>
                            <h1 class="hero-title font-orbitron text-4xl md:text-5xl lg:text-6xl font-black text-white mb-6 leading-tight">
                                <span class="text-transparent bg-clip-text bg-gradient-to-r from-ngen-cyan via-blue-400 to-ngen-cyan">${data.hero_title}</span>
                            </h1>
                            <p class="mt-4 text-xl text-gray-300 font-light mb-8 italic">${data.hero_desc || ''}</p>
                            ${data.hero_btn_text ? `
                            <div class="mt-8 flex justify-center">
                                <a href="#sekcje" class="magnetic relative group inline-flex items-center justify-center px-8 py-4 text-base font-bold text-black uppercase tracking-wider bg-ngen-cyan rounded-full overflow-hidden transition-shadow hover:shadow-[0_0_35px_#00f3ff]">
                                    <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
                                    <span class="relative">${data.hero_btn_text}</span>
                                </a>
                            </div>` : ''}
                        </div>
                    </header>`;
                }

                html += `<div id="sekcje"></div>`;

                // BLOKI CMS
                if (data.sekcje && data.sekcje.length > 0) {
                    data.sekcje.forEach((blok) => {
                        html += `<section class="py-16 relative z-10"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">`;
                        switch (blok.type) {
                            case 'blok_kafelki':
                                const isRed = blok.styl === "Czerwony (Problemy)";
                                const textColor = isRed ? 'neon-text-red' : 'text-ngen-cyan neon-text';
                                const bgIconColor = isRed ? 'bg-red-900/30' : 'bg-ngen-blue/50';
                                const borderIcon = isRed ? 'border-ngen-red/30 group-hover:border-ngen-red' : 'border-ngen-cyan/30 group-hover:border-ngen-cyan';
                                const svgColor = isRed ? 'text-ngen-red' : 'text-ngen-cyan';
                                html += `<div class="text-center mb-16 reveal">
                                    <h2 class="font-orbitron text-3xl md:text-5xl font-bold text-white mb-4"><span class="${textColor}">${blok.tytul || ''}</span></h2>
                                    <p class="text-gray-400 mt-4 max-w-2xl mx-auto">${blok.opis || ''}</p>
                                </div><div class="grid grid-cols-1 md:grid-cols-3 gap-8">`;
                                if (blok.kafelki) {
                                    blok.kafelki.forEach((kaf, i) => {
                                        html += `
                                        <div class="reveal reveal-delay-${i % 3 + 1}">
                                          <div class="tilt ${isRed ? 'tilt-red glass-red' : ''} glass-panel group h-full p-8 rounded-2xl" data-tilt="12">
                                            <div class="tilt-inner">
                                                <div class="w-14 h-14 rounded-full flex items-center justify-center mb-6 border transition-colors ${bgIconColor} ${borderIcon} ${svgColor}">
                                                    <div class="w-7 h-7">${icons[kaf.ikona] || icons["Dokumenty"]}</div>
                                                </div>
                                                <h3 class="text-xl font-bold text-white mb-4 font-orbitron group-hover:${svgColor} transition-colors">${kaf.tytul_kafelek || ''}</h3>
                                                <p class="text-gray-400 font-light mb-4">${kaf.tekst_kafelek || ''}</p>
                                                ${renderBtn(kaf.btn_text, kaf.btn_link, isRed)}
                                            </div><div class="glare"></div>
                                          </div>
                                        </div>`;
                                    });
                                }
                                html += `</div>`;
                                break;
                            case 'blok_tekst_grafika':
                                const order = blok.uklad === "Grafika po lewej" ? 'md:order-first' : '';
                                html += `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center reveal">
                                    <div class="markdown-content">
                                        <h2 class="font-orbitron text-3xl font-bold text-white mb-6">${blok.tytul || ''}</h2>
                                        ${marked.parse(blok.tresc || '')}
                                        ${renderBtn(blok.btn_text, blok.btn_link)}
                                    </div>
                                    <div class="${order}"><div class="tilt relative rounded-2xl overflow-hidden neon-border" data-tilt="6">
                                        <img src="${blok.zdjecie || ''}" class="w-full h-auto object-cover"><div class="glare"></div>
                                    </div></div>
                                </div>`;
                                break;
                            case 'blok_tytul_tekst':
                                html += `
                                <div class="max-w-4xl mx-auto text-center reveal glass-panel p-10 rounded-2xl">
                                    <h2 class="font-orbitron text-3xl font-bold text-white mb-6">${blok.tytul || ''}</h2>
                                    <div class="markdown-content text-left md:text-center">${marked.parse(blok.tresc || '')}</div>
                                    ${renderBtn(blok.btn_text, blok.btn_link)}
                                </div>`;
                                break;
                            case 'blok_cta':
                                let ctaBtnHtml = ''; if (blok.btn_text) { ctaBtnHtml = `<a href="${blok.btn_link || '#'}" class="magnetic mt-8 inline-block px-12 py-5 text-lg md:text-xl font-bold uppercase tracking-widest rounded-full neon-border hover:shadow-[0_0_40px_#00f3ff] hover:bg-ngen-cyan hover:text-black text-ngen-cyan">${blok.btn_text}</a>`; }
                                html += `
                                <div id="kontakt" class="max-w-5xl mx-auto text-center reveal glass-panel rounded-3xl p-12 relative overflow-hidden">
                                    <div class="absolute -top-24 -left-24 w-48 h-48 bg-ngen-cyan rounded-full filter blur-3xl opacity-20 pointer-events-none"></div>
                                    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-600 rounded-full filter blur-3xl opacity-30 pointer-events-none"></div>
                                    <h2 class="font-orbitron text-3xl md:text-5xl font-bold text-white mb-6 relative z-10">${blok.tytul || ''} <span class="text-transparent bg-clip-text bg-gradient-to-r from-ngen-cyan to-blue-400">${blok.tytul_wyrozniony || ''}</span></h2>
                                    <p class="text-xl text-gray-300 mb-10 font-light italic relative z-10">${blok.opis || ''}</p>
                                    <div class="relative z-10">${ctaBtnHtml}</div>
                                </div>`;
                                break;
                        }
                        html += `</div></section>`;
                    });
                }
                document.getElementById('app-content').innerHTML = html;
                if(window.initScrollReveal) window.initScrollReveal();
                if(window.initTilt) window.initTilt();
                if(window.initMagnetic) window.initMagnetic();
            })
            .catch(err => console.error("Brak pliku JSON. Wypełnij stronę w panelu CMS!", err));
    </script>
</body>
</html>
