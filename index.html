<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow N Hub | Automatyzacje i Integracje</title>
    
    <!-- Fonty i Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Skrypt logowania CMS -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ngen-cyan': '#00f3ff',
                        'ngen-blue': '#231b4b',
                        'ngen-dark': '#05050a',
                        'ngen-red': '#ff3366',
                    },
                    fontFamily: {
                        'orbitron': ['Orbitron', 'sans-serif'],
                        'space': ['Space Grotesk', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #05050a; color: #ffffff; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        
        /* Style Cyjanowe */
        .neon-text { text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5); }
        .neon-border { box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.5); }
        .neon-border:hover { box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), inset 0 0 20px rgba(0, 243, 255, 0.2); border: 1px solid rgba(0, 243, 255, 0.8); }
        
        /* Style Czerwone */
        .neon-text-red { color: #ff3366; text-shadow: 0 0 10px rgba(255, 51, 102, 0.7), 0 0 20px rgba(255, 51, 102, 0.5); }
        .neon-border-red { box-shadow: 0 0 15px rgba(255, 51, 102, 0.3), inset 0 0 15px rgba(255, 51, 102, 0.1); border: 1px solid rgba(255, 51, 102, 0.5); }
        .neon-border-red:hover { box-shadow: 0 0 25px rgba(255, 51, 102, 0.6), inset 0 0 20px rgba(255, 51, 102, 0.2); border: 1px solid rgba(255, 51, 102, 0.8); }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .glass-panel { background: rgba(35, 27, 75, 0.4); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.1); border-left: 1px solid rgba(255, 255, 255, 0.1); }
        .markdown-content p { margin-bottom: 1rem; color: #d1d5db; line-height: 1.8; font-weight: 300; }
        .markdown-content strong { color: #fff; font-weight: 600; }
        .markdown-content a { color: #00f3ff; text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05050a; }
        ::-webkit-scrollbar-thumb { background: #231b4b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body class="antialiased">
    <canvas id="particle-canvas"></canvas>

    <!-- Nawigacja -->
    <nav class="fixed w-full z-50 transition-all duration-300 bg-ngen-dark/90 backdrop-blur-md shadow-lg shadow-ngen-cyan/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.scrollTo(0,0)">
                    <img class="h-12 w-auto invert mix-blend-screen brightness-200" src="Gemini_Generated_Image_qyc351qyc351qyc3.jpeg" alt="Flow N Hub Logo">
                </div>
            </div>
        </div>
    </nav>

    <!-- Tutaj Javascript wrzuci całą treść z CMS -->
    <main id="app-content"></main>

    <!-- Stopka -->
    <footer class="relative z-10 border-t border-gray-800 bg-ngen-dark/80 backdrop-blur-md mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row items-center justify-between">
            <p class="text-gray-500 text-sm font-light">&copy; <script>document.write(new Date().getFullYear())</script> Flow N Hub.</p>
        </div>
    </footer>

    <!-- SKRYPT BUDUJĄCY STRONĘ Z CMS -->
    <script>
        // Słownik ikon SVG
        const icons = {
            "Zegar": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            "Dokumenty": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`,
            "Trybik": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`,
            "Żarówka": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>`,
            "Ostrzeżenie": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`,
            "Wykres": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>`,
            "Kopiuj": `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>`
        };

        // Funkcja renderująca przycisk
        const renderBtn = (text, link, isRed = false) => {
            if(!text) return '';
            const borderClass = isRed ? 'neon-border-red hover:shadow-[0_0_30px_#ff3366]' : 'neon-border hover:shadow-[0_0_30px_#00f3ff] hover:bg-ngen-cyan hover:text-black';
            const textClass = isRed ? 'text-ngen-red' : 'text-ngen-cyan';
            return `<a href="${link || '#'}" class="mt-6 inline-block px-6 py-2 text-sm font-bold uppercase tracking-wider rounded-full transition-all duration-300 ${borderClass} ${textClass}">${text}</a>`;
        };

        // Pobieranie danych i budowanie strony
        fetch('content.json')
            .then(response => response.json())
            .then(data => {
                let html = '';

                // HERO
                html += `
                <header class="relative pt-32 pb-20 overflow-hidden min-h-screen flex items-center">
                    <div class="relative z-10 max-w-7xl mx-auto px-4 w-full text-center reveal">
                        <h1 class="font-orbitron text-5xl md:text-7xl font-black text-white mb-6">
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-ngen-cyan to-blue-500">${data.hero_title || 'Flow N Hub'}</span>
                        </h1>
                        <p class="mt-4 text-xl md:text-3xl text-gray-300 font-light mb-8 italic">${data.hero_desc || ''}</p>
                        ${data.hero_btn_text ? `<a href="#sekcje" class="mt-8 inline-flex px-8 py-4 text-base font-bold text-black uppercase bg-ngen-cyan rounded-full hover:scale-105 hover:shadow-[0_0_30px_#00f3ff] transition-all">${data.hero_btn_text}</a>` : ''}
                    </div>
                </header><div id="sekcje"></div>`;

                // BLOKI
                if (data.sekcje && data.sekcje.length > 0) {
                    data.sekcje.forEach((blok, index) => {
                        html += `<section class="py-16 relative z-10"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">`;
                        
                        switch(blok.type) {
                            case 'blok_kafelki':
                                const isRed = blok.styl === "Czerwony (Problemy)";
                                const textColor = isRed ? 'neon-text-red' : 'text-ngen-cyan neon-text';
                                const bgIconColor = isRed ? 'bg-red-900/30' : 'bg-ngen-blue/50';
                                const borderIcon = isRed ? 'border-ngen-red/30 group-hover:border-ngen-red' : 'border-ngen-cyan/30 group-hover:border-ngen-cyan';
                                const svgColor = isRed ? 'text-ngen-red' : 'text-ngen-cyan';
                                
                                html += `<div class="text-center mb-16 reveal">
                                    <h2 class="font-orbitron text-3xl md:text-5xl font-bold text-white mb-4"><span class="${textColor}">${blok.tytul || ''}</span></h2>
                                    <p class="text-gray-400 mt-4 max-w-2xl mx-auto">${blok.opis || ''}</p>
                                </div><div class="grid grid-cols-1 md:grid-cols-3 gap-8">`;
                                
                                if(blok.kafelki) {
                                    blok.kafelki.forEach((kaf, i) => {
                                        html += `
                                        <div class="glass-panel p-8 rounded-2xl transition-all duration-300 hover:-translate-y-2 group reveal reveal-delay-${i%3+1} border border-gray-800">
                                            <div class="w-14 h-14 rounded-full flex items-center justify-center mb-6 border transition-colors ${bgIconColor} ${borderIcon} ${svgColor}">
                                                <div class="w-7 h-7">${icons[kaf.ikona] || icons["Dokumenty"]}</div>
                                            </div>
                                            <h3 class="text-xl font-bold text-white mb-4 font-orbitron group-hover:${svgColor} transition-colors">${kaf.tytul_kafelek || ''}</h3>
                                            <p class="text-gray-400 font-light mb-4">${kaf.tekst_kafelek || ''}</p>
                                            ${renderBtn(kaf.btn_text, kaf.btn_link, isRed)}
                                        </div>`;
                                    });
                                }
                                html += `</div>`;
                                break;

                            case 'blok_tekst_grafika':
                                const order = blok.uklad === "Grafika po lewej" ? 'md:order-first' : '';
                                html += `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center reveal">
                                    <div class="markdown-content">
                                        <h2 class="font-orbitron text-3xl font-bold text-white mb-6">${blok.tytul || ''}</h2>
                                        ${marked.parse(blok.tresc || '')}
                                        ${renderBtn(blok.btn_text, blok.btn_link)}
                                    </div>
                                    <div class="${order} rounded-2xl overflow-hidden neon-border">
                                        <img src="${blok.zdjecie || ''}" class="w-full h-auto object-cover">
                                    </div>
                                </div>`;
                                break;

                            case 'blok_tytul_tekst':
                                html += `
                                <div class="max-w-4xl mx-auto text-center reveal glass-panel p-10 rounded-2xl border border-gray-800">
                                    <h2 class="font-orbitron text-3xl font-bold text-white mb-6">${blok.tytul || ''}</h2>
                                    <div class="markdown-content text-left md:text-center">${marked.parse(blok.tresc || '')}</div>
                                    ${renderBtn(blok.btn_text, blok.btn_link)}
                                </div>`;
                                break;

                            case 'blok_sam_tekst':
                                html += `<div class="max-w-4xl mx-auto reveal markdown-content glass-panel p-8 rounded-2xl">${marked.parse(blok.tresc || '')}</div>`;
                                break;

                            case 'blok_cta':
                                html += `
                                <div class="max-w-5xl mx-auto text-center reveal glass-panel rounded-3xl p-12 border border-ngen-cyan/20">
                                    <h2 class="font-orbitron text-3xl md:text-5xl font-bold text-white mb-6">
                                        ${blok.tytul || ''} <span class="text-transparent bg-clip-text bg-gradient-to-r from-ngen-cyan to-blue-400">${blok.tytul_wyrozniony || ''}</span>
                                    </h2>
                                    <p class="text-xl text-gray-300 mb-10 font-light italic">${blok.opis || ''}</p>
                                    ${renderBtn(blok.btn_text, blok.btn_link)}
                                </div>`;
                                break;
                                
                            case 'blok_html':
                                html += `<div class="w-full reveal">${blok.kod || ''}</div>`;
                                break;
                        }
                        html += `</div></section>`;
                    });
                }

                document.getElementById('app-content').innerHTML = html;
                initScrollReveal();
            })
            .catch(err => console.error("Brak pliku content.json", err));

        // Inicjalizacja animacji po załadowaniu
        function initScrollReveal() {
            const reveals = document.querySelectorAll('.reveal');
            const elementInView = (el, dividend = 1.1) => {
                return (el.getBoundingClientRect().top <= (window.innerHeight || document.documentElement.clientHeight) / dividend);
            };
            const handleScroll = () => {
                reveals.forEach(reveal => { if (elementInView(reveal, 1.1)) reveal.classList.add('active'); });
            };
            window.addEventListener('scroll', handleScroll);
            handleScroll();
        }

        // Tło Canvas
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height; let particles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 0.5;
                this.color = ['#00f3ff', '#ffffff', '#231b4b'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                if(this.color === '#00f3ff') { ctx.shadowBlur = 10; ctx.shadowColor = '#00f3ff'; } else { ctx.shadowBlur = 0; }
                ctx.fill();
            }
        }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                    if (dist < 130) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 243, 255, ${(1 - dist/130) * 0.2})`; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        resize(); for (let i = 0; i < (window.innerWidth < 768 ? 40 : 100); i++) particles.push(new Particle()); animate();

        // CMS przekierowanie
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) { window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; }); }
            });
        }
    </script>
</body>
</html>
